<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HBnB - Login">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>HBnB - Login</title>
</head>

<body>
    <header>
        <div class="header-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="HBnB Logo" class="logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" class="login-button">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="login-section">
            <div class="login-container">
                <h1>Login to Your Account</h1>

                <div id="error-message"
                    style="display: none; color: #FF5A5F; margin-bottom: 20px; padding: 12px; background-color: #FFE0E0; border-radius: 6px; text-align: center; font-weight: 500;">
                </div>

                <form class="form" id="login-form" method="POST" action="#">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>

                    <button type="submit" class="submit-button">Login</button>
                </form>

                <p class="signup-link">Don't have an account? <a href="#">Sign up here</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>

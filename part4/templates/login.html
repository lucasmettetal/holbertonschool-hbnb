<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HBnB - Se connecter">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>HBnB - Se connecter</title>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="brand" aria-label="HBnB Accueil">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo HBnB" class="logo">
            </a>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <a href="{{ url_for('serve_register') }}" id="register-link" class="login-button" style="background-color: #6B7280;">S'inscrire</a>
                <a href="{{ url_for('serve_login') }}" id="login-link" class="login-button">Se connecter</a>
                <a href="#" id="logout-link" class="login-button" style="background-color: #6B7280; display: none;">Déconnexion</a>
            </div>
        </div>
    </header>

    <main>
        <section class="login-section">
            <div class="login-container">
                <h1>Se connecter à votre compte</h1>

                <div id="error-message"
                    style="display: none; color: #2F6FED; margin-bottom: 20px; padding: 12px; background-color: rgba(47, 111, 237, 0.1); border-radius: 6px; text-align: center; font-weight: 500;">
                </div>

                <form class="form" id="login-form" method="POST" action="#">
                    <div class="form-group">
                        <label for="email">Adresse email</label>
                        <input type="email" id="email" name="email" required placeholder="Tapez votre email">
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" required placeholder="Tapez votre mot de passe">
                    </div>

                    <button type="submit" class="submit-button">Se connecter</button>
                </form>

                <p class="signup-link">Vous n'avez pas de compte ? <a href="{{ url_for('serve_register') }}">S'inscrire ici</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>Tous droits réservés.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>

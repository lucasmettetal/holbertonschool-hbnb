<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HBnB - Place Details">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>HBnB - Place Details</title>
</head>

<body>
    <header>
        <div class="header-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="HBnB Logo" class="logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html" class="login-button">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="place-details" id="place-details">
        </section>

        <section id="add-review" style="margin: 40px auto; max-width: 1200px; padding: 20px;">
            <div class="review-action">
                <a id="add-review-link" href="add_review.html" class="details-button"
                    style="display: inline-block; text-decoration: none; background-color: #FF5A5F; color: white; padding: 12px 24px; border-radius: 6px; text-align: center; font-weight: 600;">Add
                    Your Review</a>
            </div>
        </section>

        <div id="error-message"
            style="display: none; color: #FF5A5F; margin: 20px auto; max-width: 1200px; padding: 12px; background-color: #FFE0E0; border-radius: 6px; text-align: center; font-weight: 500;">
        </div>
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>

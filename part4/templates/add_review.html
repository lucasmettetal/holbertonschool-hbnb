<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HBnB - Ajouter un avis">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>HBnB - Ajouter un avis</title>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="brand" aria-label="HBnB Accueil">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo HBnB" class="logo">
            </a>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <a href="{{ url_for('serve_create_place') }}" id="create-place-link" class="login-button" style="background-color: #16A34A; display: none;">+ Ajouter une annonce</a>
                <a href="{{ url_for('serve_login') }}" id="login-link" class="login-button">Se connecter</a>
                <a href="#" id="logout-link" class="login-button" style="background-color: #6B7280; display: none;">Déconnexion</a>
            </div>
        </div>
    </header>

    <main>
        <section class="add-review">
            <div class="review-form-container">
                <h1>Partagez votre expérience</h1>
                <p class="subtitle">Laisser un avis pour ce logement</p>

                <form class="form" id="review-form" method="POST" action="#">
                    <div id="error-message"
                        style="display: none; color: #2F6FED; margin-bottom: 20px; padding: 12px; background-color: rgba(47, 111, 237, 0.1); border-radius: 6px; text-align: center; font-weight: 500;">
                    </div>

                    <div id="success-message"
                        style="display: none; color: #16A34A; margin-bottom: 20px; padding: 12px; background-color: rgba(22, 163, 74, 0.1); border-radius: 6px; text-align: center; font-weight: 500;">
                    </div>
                    <div class="form-group">
                        <label for="rating">Note</label>
                        <select id="rating" name="rating" required>
                            <option value="">Sélectionnez une note</option>
                            <option value="5">★★★★★ Excellent (5/5)</option>
                            <option value="4">★★★★☆ Très bien (4/5)</option>
                            <option value="3">★★★☆☆ Moyen (3/5)</option>
                            <option value="2">★★☆☆☆ Passable (2/5)</option>
                            <option value="1">★☆☆☆☆ Mauvais (1/5)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comment">Votre avis</label>
                        <textarea id="comment" name="comment" required
                            placeholder="Écrivez votre avis ici... (minimum 10 caractères)" rows="6"
                            minlength="10"></textarea>
                    </div>

                    <button type="submit" class="submit-button">Envoyer l'avis</button>
                    <a id="cancel-button" href="place.html" class="cancel-button">Annuler</a>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>Tous droits réservés.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HBnB - Add Review">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>HBnB - Add Review</title>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="brand" aria-label="HBnB Home">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="HBnB Logo" class="logo">
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-home">Home</a>
            </nav>
            <div class="header-actions">
                <a href="login.html" class="login-button">Login</a>
            </div>
        </div>
    </header>

    <main>
        <section class="add-review">
            <div class="review-form-container">
                <h1>Share Your Experience</h1>
                <p class="subtitle">Leave a review for this property</p>

                <form class="form" id="review-form" method="POST" action="#">
                    <div id="error-message"
                        style="display: none; color: #FF5A5F; margin-bottom: 20px; padding: 12px; background-color: #FFE0E0; border-radius: 6px; text-align: center; font-weight: 500;">
                    </div>

                    <div id="success-message"
                        style="display: none; color: #008489; margin-bottom: 20px; padding: 12px; background-color: #E0F7F6; border-radius: 6px; text-align: center; font-weight: 500;">
                    </div>
                    <div class="form-group">
                        <label for="username">Your Name</label>
                        <input type="text" id="username" name="username" required placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="rating">Rating</label>
                        <select id="rating" name="rating" required>
                            <option value="">Select a rating</option>
                            <option value="5">★★★★★ Excellent (5/5)</option>
                            <option value="4">★★★★☆ Good (4/5)</option>
                            <option value="3">★★★☆☆ Average (3/5)</option>
                            <option value="2">★★☆☆☆ Fair (2/5)</option>
                            <option value="1">★☆☆☆☆ Poor (1/5)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comment">Your Review</label>
                        <textarea id="comment" name="comment" required
                            placeholder="Write your review here... (minimum 10 characters)" rows="6"
                            minlength="10"></textarea>
                    </div>

                    <button type="submit" class="submit-button">Submit Review</button>
                    <a id="cancel-button" href="place.html" class="cancel-button">Cancel</a>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>

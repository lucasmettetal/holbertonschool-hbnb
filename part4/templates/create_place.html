<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HBnB - Créer une annonce">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>HBnB - Créer une annonce</title>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="brand" aria-label="HBnB Accueil">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo HBnB" class="logo">
            </a>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <a href="{{ url_for('serve_create_place') }}" id="create-place-link" class="login-button" style="background-color: #16A34A; display: none;">+ Ajouter une annonce</a>
                <a href="{{ url_for('serve_login') }}" id="login-link" class="login-button">Se connecter</a>
                <a href="#" id="logout-link" class="login-button" style="background-color: #6B7280; display: none;">Déconnexion</a>
            </div>
        </div>
    </header>

    <main>
        <section class="login-section">
            <div class="login-container" style="max-width: 650px;">
                <h1>Créer une annonce</h1>
                <p class="subtitle">Partagez votre logement avec les voyageurs</p>

                <div id="error-message" style="display: none; color: #2F6FED; margin-bottom: 20px; padding: 12px; background-color: rgba(47, 111, 237, 0.1); border-radius: 6px; text-align: center; font-weight: 500;"></div>
                <div id="success-message" style="display: none; color: #16A34A; margin-bottom: 20px; padding: 12px; background-color: rgba(22, 163, 74, 0.1); border-radius: 6px; text-align: center; font-weight: 500;"></div>

                <form class="form" id="create-place-form" method="POST" action="#" style="max-width: 100%;">

                    <div class="form-group">
                        <label for="title">Titre</label>
                        <input type="text" id="title" name="title" required placeholder="Ex. Studio cosy près de la plage">
                    </div>

                    <div class="form-group">
                        <label for="image-upload">Photo de l'annonce</label>
                        <div style="display: flex; gap: 10px; flex-direction: column;">
                            <input type="file" id="image-upload" name="image" accept="image/*" style="padding: 10px; border: 2px dashed #2F6FED; border-radius: 6px; background-color: #f9fafb;">
                            <div id="image-preview" style="display: none; margin-top: 10px;">
                                <img id="preview-img" src="" alt="Aperçu" style="max-width: 200px; max-height: 150px; border-radius: 6px; object-fit: cover;">
                                <button type="button" id="remove-image-btn" style="margin-top: 8px; padding: 8px 12px; background-color: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Supprimer l'image</button>
                            </div>
                            <p id="upload-status" style="color: #6B7280; font-size: 13px;"></p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Décrivez votre logement..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="price">Prix par nuit ($)</label>
                        <input type="number" id="price" name="price" required min="1" step="0.01" placeholder="Ex. 85">
                    </div>

                    <!-- Address with geocoding — replaces lat/lng inputs -->
                    <div class="form-group">
                        <label for="address">Adresse</label>
                        <div style="display: flex; gap: 10px;">
                            <input
                                type="text"
                                id="address"
                                name="address"
                                placeholder="Ex. 10 Rue de Rivoli, Paris"
                                style="flex: 1;"
                            >
                            <button
                                type="button"
                                id="geocode-btn"
                                style="flex-shrink: 0; padding: 12px 18px; background-color: #16A34A; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;"
                            >
                                Localiser
                            </button>
                        </div>

                        <!-- Location feedback -->
                        <div id="location-feedback" style="display: none; margin-top: 10px; padding: 10px 14px; background: rgba(22, 163, 74, 0.08); border: 1px solid #16A34A; border-radius: 6px; font-size: 14px; color: #16A34A; font-weight: 500;">
                        </div>
                    </div>

                    <!-- Hidden fields — populated by geocoding -->
                    <input type="hidden" id="latitude" name="latitude">
                    <input type="hidden" id="longitude" name="longitude">
                    <input type="hidden" id="image-url" name="image_url">

                    <!-- City & country — auto-filled by geocoding, read-only -->
                    <div style="display: flex; gap: 12px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="city">Ville</label>
                            <input type="text" id="city" name="city" readonly placeholder="Rempli après la géolocalisation" style="background-color: #f5f5f5; cursor: default;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="country">Pays</label>
                            <input type="text" id="country" name="country" readonly placeholder="Rempli après la géolocalisation" style="background-color: #f5f5f5; cursor: default;">
                        </div>
                    </div>

                    <!-- Amenities -->
                    <div class="form-group">
                        <label>Équipements</label>
                        <div id="amenities-list" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; min-height: 36px;">
                            <p style="color: #717171; font-size: 14px;">Chargement des équipements...</p>
                        </div>
                    </div>

                    <button type="submit" class="submit-button" style="margin-top: 20px;">Publier l'annonce</button>
                    <a href="{{ url_for('serve_index') }}" class="cancel-button" style="display: block; text-align: center; margin-top: 10px; padding: 12px; border-radius: 6px; text-decoration: none; background-color: #ddd; color: #222; font-weight: 600;">Annuler</a>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>Tous droits réservés.</p>
    </footer>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>

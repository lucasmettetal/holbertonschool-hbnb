<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#FF5A5F" rx="40"/>

  <!-- House shape -->
  <g transform="translate(50, 40)">
    <!-- Roof -->
    <polygon points="50,0 100,50 0,50" fill="#ffffff"/>

    <!-- Walls -->
    <rect x="15" y="50" width="70" height="70" fill="#ffffff"/>

    <!-- Door -->
    <rect x="40" y="90" width="20" height="30" fill="#FF5A5F"/>
    <circle cx="58" cy="105" r="2" fill="#008489"/>

    <!-- Windows -->
    <rect x="20" y="55" width="12" height="12" fill="#008489"/>
    <rect x="68" y="55" width="12" height="12" fill="#008489"/>
  </g>
</svg>